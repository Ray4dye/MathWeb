<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home - Persamaan Lingkaran</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-body: #ffffff;
        --bg-grid: #e2e8f0;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --primary: #2d70b3;
        --accent: #47b39d;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Outfit", sans-serif;
      }

      body {
        background-color: var(--bg-body);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        /* Grid Tebal */
        background-image:
          linear-gradient(var(--bg-grid) 2px, transparent 2px),
          linear-gradient(90deg, var(--bg-grid) 2px, transparent 2px);
        background-size: 40px 40px;
        position: relative;
        overflow-x: hidden;
      }

      /* Gelombang Biru sesuai Foto */
      body::after {
        content: "";
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 25vh;
        background: var(--primary);
        clip-path: polygon(
          100% 100%,
          0% 100%,
          0% 60%,
          15% 75%,
          35% 50%,
          55% 80%,
          75% 40%,
          100% 70%
        );
        z-index: -1;
        opacity: 0.9;
      }

      nav {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 1.2rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid var(--bg-grid);
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .logo {
        font-weight: 800;
        color: var(--primary);
        font-size: 1.5rem;
        text-decoration: none;
      }
      .menu a {
        text-decoration: none;
        color: var(--text-muted);
        font-weight: 600;
        margin-left: 25px;
        transition: 0.3s;
      }
      .menu a:hover,
      .menu a.active {
        color: var(--primary);
      }

      .container {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }

      .card {
        background: rgba(255, 255, 255, 0.9);
        padding: 60px;
        border-radius: 30px;
        border: 2px solid var(--bg-grid);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        max-width: 1200px;
        width: 100%;
        display: flex;
        align-items: center;
        gap: 60px;
      }

      .hero-content {
        flex: 1.2;
        text-align: left;
      }

      .group-badge {
        display: inline-block;
        background: white;
        border: 2px solid var(--primary);
        color: var(--primary);
        padding: 8px 25px;
        border-radius: 50px;
        font-size: 0.9rem;
        font-weight: 700;
        margin-bottom: 25px;
        text-transform: uppercase;
      }

      h1 {
        color: #0f172a;
        font-size: 4rem;
        margin-bottom: 20px;
        font-weight: 800;
        line-height: 1.1;
      }
      p {
        margin-bottom: 40px;
        color: var(--text-muted);
        line-height: 1.8;
        font-size: 1.3rem;
      }

      .btn {
        background: var(--primary);
        color: white;
        padding: 20px 50px;
        text-decoration: none;
        border-radius: 50px;
        font-weight: bold;
        font-size: 1.1rem;
        display: inline-block;
        transition: 0.3s;
      }
      .btn:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(45, 112, 179, 0.4);
      }

      .hero-illustration {
        flex: 1;
        display: flex;
        justify-content: flex-end;
      }
      .hero-svg {
        width: 100%;
        max-width: 550px;
        height: auto;
      }

      @media (max-width: 992px) {
        .card {
          flex-direction: column-reverse;
          text-align: center;
          padding: 40px;
        }
        h1 {
          font-size: 3rem;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="index.html" class="logo">Persamaan Lingkaran</a>
      <div class="menu">
        <a href="index.html" class="active">Beranda</a>
        <a href="materi.html">Materi</a>
        <a href="latihan.html">Latihan Soal</a>
      </div>
    </nav>

    <div class="container">
      <div class="card">
        <div class="hero-content">
          <div class="group-badge">Kelompok 3</div>
          <h1>Persamaan Lingkaran</h1>
          <p>
            Pelajari konsep fundamental geometri analitik melalui visualisasi
            interaktif dan penurunan rumus yang mendalam.
          </p>
          <a href="materi.html" class="btn">Mulai Belajar 🚀</a>
        </div>

        <div class="hero-illustration">
          <svg
            class="hero-svg"
            viewBox="0 0 400 400"
            xmlns="http://www.w3.org/2000/svg"
          >
            <line
              x1="30"
              y1="200"
              x2="370"
              y2="200"
              stroke="#94a3b8"
              stroke-width="4"
            />
            <line
              x1="200"
              y1="30"
              x2="200"
              y2="370"
              stroke="#94a3b8"
              stroke-width="4"
            />
            <circle
              cx="260"
              cy="140"
              r="100"
              stroke="#2d70b3"
              stroke-width="8"
              fill="rgba(45, 112, 179, 0.05)"
            />
            <circle cx="260" cy="140" r="8" fill="#2d70b3" />
            <line
              x1="260"
              y1="140"
              x2="355"
              y2="165"
              stroke="#2d70b3"
              stroke-width="4"
              stroke-dasharray="10,6"
            />
            <text x="210" y="125" fill="#64748b" font-weight="bold">
              P(a, b)
            </text>
            <text
              x="325"
              y="145"
              fill="#2d70b3"
              font-weight="bold"
              font-size="24"
            >
              r
            </text>
            <text
              x="200"
              y="385"
              font-size="28"
              font-weight="800"
              text-anchor="middle"
              fill="#0f172a"
            >
              (x - a)² + (y - b)² = r²
            </text>
          </svg>
        </div>
      </div>
    </div>
  </body>
</html>
